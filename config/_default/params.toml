mainSections   = ["post"]
rssFullContent = true
favicon        = "img/avatar.png"

[footer]
    since = 2020

[sidebar]
    emoji    = "✏️"
    subtitle = "只是个铅笔"
    avatar   = "img/avatar.png"

[article]
    math = true
    toc = true
    readingTime = true
    [article.license]
        enabled = true
        default = "Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page     = [{ type = "toc" }]

[comments]
    # See complete configuration in config/_default/params.toml
    enabled  = true
    provider = "giscus"
    [comments.giscus]
        repo = "WedLG/wedlg.github.io"
        repoId = "R_kgDOKgbUqg"
        category = "Announcements"
        categoryId = "DIC_kwDOKgbUqs4DCyVr"
        mapping = "pathname"
        strict = false
        reactionsEnabled = true
        emitMetadata = false
        inputPosition = "bottom"
        theme = "preferred_color_scheme"
        lang = "zh-CN"
        loading = "lazy"

# GDPR Cookie Consent Configuration
# When enabled, analytics and functional cookies require user consent
[cookies]
    enabled = false

    [cookies.categories]
        analytics  = true
        functional = true
